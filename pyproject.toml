[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tnsets"
version = "1.0.0"
description = "Gaussian-process datamodels with presence-aware product covariances for training data attribution"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# The benchmarks and the attribution routines also need the TNDM release, installed
# from third_party/TNDM (scripts/get_tndm.sh); it is not on PyPI, so it is not listed here.
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "torch>=2.2",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: long-running checks",
  "gpu: needs a CUDA device",
]
